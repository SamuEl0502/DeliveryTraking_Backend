# PostgreSQL local para desarrollo: docker compose up -d
# DATABASE_URL=postgresql://delivery:delivery@localhost:5432/delivery_tracking
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: delivery_tracking
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delivery -d delivery_tracking']
      interval: 5s
      retries: 10

volumes:
  pgdata:
